<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">About</title>
<desc id="d">I&#x27;ve been fascinated by how computers work since I was 10, the day I sat in front of one for the first time. That curiosity became a career: for more than a decade I&#x27;ve been shipping software professionally. These days I lead multiple engineering squads, and in my free time I always write code for my own projects and share technical articles on DEV Community.</desc>
