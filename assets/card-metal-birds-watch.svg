<text x="36" y="71" letter-spacing="1" fill="#3fb950" style="font-size:11px">HACKATHON WINNER</text>
<text x="28" y="100" class="fg" style="font-size:13px">Real-time notifications when planes fly</text>
<text x="28" y="120" class="fg" style="font-size:13px">over your location, with live aircraft data</text>
