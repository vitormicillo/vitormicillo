<text x="28" y="46" font-weight="700" class="cy" style="font-size:17px">Metal Birds Watch</text>
<path d="M212.39999999999998 43l8-8M214.39999999999998 35h6v6" fill="none" stroke="#00d9ff" stroke-width="1.6"/>
