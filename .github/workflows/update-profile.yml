name: Update profile

on:
  schedule:
    - cron: "17 12 * * *"            # daily at 12:17 …
      timezone: "America/New_York"    # … New York time (IANA zone name)
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:                   # re-render right away when the generator itself changes
      - "tools/profile/*.py"
      - "tools/profile/icons.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write            # needed to commit the refreshed files

concurrency:
  group: update-profile      # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pinned so the embedded fonts stay byte-identical between runs
      - name: Install dependencies
        run: pip install fonttools==4.62.1 brotli==1.2.0

      - name: Fetch data
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}   # optional: adds private contributions
          GITHUB_TOKEN: ${{ github.token }}             # fallback: public data only
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}       # optional: adds DEV views and followers
        run: python tools/profile/fetch.py

      - name: Render SVGs
        run: python tools/profile/render.py

      - name: Update README
        run: python tools/profile/readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/profile/data assets README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh profile stats"
            git push
          fi